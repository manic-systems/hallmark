name: Tag and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    name: CI
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  prepare:
    permissions:
      contents: write
      id-token: write
    needs: ci
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@23a06db817dba5ff9dee828279eb3070f405d9e1 # v2.3.1
    with:
      stage: prepare
      version-command: nix run nixpkgs#fq -- -r '.package.version' Cargo.toml

  package:
    name: Package
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.version }}
          persist-credentials: false

      - name: Package crate
        run: cargo package --locked

      - name: Upload crate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "$VERSION" "target/package/hallmark-${VERSION#v}.crate"

  finalize:
    permissions:
      contents: write
      id-token: write
    needs: [prepare, package]
    if: ${{ needs.prepare.outputs.skip != 'true' && needs.package.result == 'success' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@23a06db817dba5ff9dee828279eb3070f405d9e1 # v2.3.1
    with:
      stage: finalize
      version: ${{ needs.prepare.outputs.version }}

  publish:
    permissions:
      contents: write
      id-token: write
    needs: [prepare, finalize]
    if: ${{ needs.prepare.outputs.skip != 'true' && needs.finalize.result == 'success' }}
    uses: manic-systems/workflows/.github/workflows/rust-release.yml@23a06db817dba5ff9dee828279eb3070f405d9e1 # v2.3.1
    with:
      stage: publish
      version: ${{ needs.prepare.outputs.version }}
      install-nix: false
      publish-command: cargo publish --locked
