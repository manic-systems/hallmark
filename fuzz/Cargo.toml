[package]
name    = "hallmark-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.hallmark]
path             = ".."
default-features = false
features         = [ "narinfo", "store_path" ]

[[bin]]
name  = "narinfo_parse"
path  = "fuzz_targets/narinfo_parse.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "store_path_parse"
path  = "fuzz_targets/store_path_parse.rs"
test  = false
doc   = false
bench = false

[workspace]
