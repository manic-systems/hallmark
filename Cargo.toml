[package]
name         = "hallmark"
description  = "Pure-Rust Nix binary-cache and store primitives"
edition      = "2024"
license      = "EUPL-1.2"
repository   = "https://github.com/manic-systems/hallmark"
rust-version = "1.95.0"
version      = "1.0.0"

[features]
default     = [ "store_path", "narinfo", "fingerprint", "sign" ]
fingerprint = [ "narinfo" ]
nar         = [  ]
narinfo     = [  ]
sign        = [ "narinfo", "fingerprint", "dep:ed25519-compact" ]
store_path  = [ "dep:hmac-sha256" ]

[dependencies]
ed25519-compact = { version = "2.6.0", optional = true, default-features = false, features = [ "opt_size" ] }
hmac-sha256     = { version = "1.1.15", optional = true, default-features = false }
thiserror       = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[lints.clippy]
pedantic = "warn"
