name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: Checks
    uses: manic-systems/workflows/.github/workflows/rust-checks.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      os: ubuntu-latest
      flake-check: false
      fmt: true
      fmt-command: cargo fmt --all --check && taplo fmt --check
      clippy: true
      clippy-command: |
        cargo clippy --all-targets --all-features -- -D warnings
        cargo clippy --no-default-features -- -D warnings
        cargo clippy --no-default-features --features store_path -- -D warnings
        cargo clippy --no-default-features --features narinfo -- -D warnings
        cargo clippy --manifest-path fuzz/Cargo.toml -- -D warnings
      test: true
      test-command: cargo test --all-features

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
    permissions:
      actions: write
      contents: read
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      os: ${{ matrix.os }}
      flake-check-command: nix flake check --no-build
      build: true
      build-command: nix build -L --no-link
      cache: true
      cache-save: true

  actions:
    name: Actions Lint
    uses: manic-systems/workflows/.github/workflows/actions-lint.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2

  required:
    name: Required Checks
    if: always()
    needs:
      - checks
      - build
      - actions
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
