[package]
name         = "hallmark"
description  = "Pure-Rust Nix binary-cache and store primitives"
keywords     = [ "nix", "nar", "narinfo", "binary-cache", "store-path" ]
categories   = [ "encoding", "cryptography", "filesystem" ]
edition      = "2024"
license      = "EUPL-1.2"
repository   = "https://github.com/manic-systems/hallmark"
rust-version = "1.95.0"
version      = "1.0.0"

[features]
default     = [ "store_path", "narinfo", "fingerprint", "sign" ]
fingerprint = [ "narinfo" ]
nar         = [  ]
narinfo     = [  ]
sign        = [ "narinfo", "fingerprint", "dep:ed25519-compact" ]
store_path  = [ "dep:hmac-sha256" ]

[dependencies]
ed25519-compact = { version = "2.6.0", optional = true, default-features = false, features = [ "opt_size", "std" ] }
hmac-sha256     = { version = "1.1.15", optional = true, default-features = false }
thiserror       = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[lints.clippy]
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"
restriction                      = { level = "warn", priority = -1 }

arbitrary_source_item_ordering  = "allow"
arithmetic_side_effects         = "allow"
as_conversions                  = "allow"
else_if_without_else            = "allow"
error_impl_error                = "allow"
exhaustive_enums                = "allow"
exhaustive_structs              = "allow"
implicit_return                 = "allow"
indexing_slicing                = "allow"
inline_modules                  = "allow"
integer_division                = "allow"
integer_division_remainder_used = "allow"
little_endian_bytes             = "allow"
missing_docs_in_private_items   = "allow"
missing_inline_in_public_items  = "allow"
missing_trait_methods           = "allow"
module_name_repetitions         = "allow"
pub_with_shorthand              = "allow"
question_mark_used              = "allow"
ref_patterns                    = "allow"
separated_literal_suffix        = "allow"
single_call_fn                  = "allow"
std_instead_of_alloc            = "allow"
std_instead_of_core             = "allow"
tests_outside_test_module       = "allow"
