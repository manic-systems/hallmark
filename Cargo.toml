[package]
name         = "hallmark"
description  = "Pure-Rust Nix binary-cache and store primitives"
edition      = "2024"
license      = "EUPL-1.2"
repository   = "https://github.com/manic-systems/hallmark"
rust-version = "1.95.0"
version      = "1.0.0"

[features]
default     = [ "store_path", "narinfo", "fingerprint", "sign" ]
fingerprint = [ "narinfo" ]
nar         = [  ]
narinfo     = [  ]
sign        = [ "narinfo", "fingerprint", "dep:base64", "dep:ed25519-dalek" ]
store_path  = [ "dep:sha2" ]

[dependencies]
base64        = { version = "0.23.1", optional = true }
ed25519-dalek = { version = "3.0.0", optional = true }
sha2          = { version = "0.11.1", optional = true }
thiserror     = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"

[lints.clippy]
pedantic = "warn"
